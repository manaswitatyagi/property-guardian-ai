[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-guardian-ai"
version = "0.1.0"
description = "Agentic property intelligence system for continuous risk monitoring and loss prevention"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.2",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "shap>=0.46.0",
  "geopandas>=0.14.0",
  "langgraph>=0.2.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.38.0",
  "plotly>=5.22.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["property_guardian_ai*"]
